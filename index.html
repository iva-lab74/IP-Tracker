<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!--My CSS-->
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    
    <!--My JS-->
    <script src="script.js" defer></script>
    <!--Font-->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />

    <title>Frontend Mentor | IP Address Tracker</title>
    <style>
        .attribution {
            font-size: 11px;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>

<body>
    <header>
        <h1>IP Address Tracker</h1>
        <!--Search button and making it accessible with aria labels-->
        <form id="search-form">
            <input id="search-input" type="text" placeholder="Search for any IP address or domain"
                aria-label="Search for any IP address or domain" />
            <button type="submit" aria-label="Search">
                <img src="images/icon-arrow.svg" alt="" />
            </button>
        </form>
        <!-- the information card style and changing data-->
        <!-- Need different divs so that the css makes different boxes-->
        <section class="info-card">
            <div>
                <h2>IP Address</h2>
                <p id="ip">-</p>
            </div>
            <div>
                <h2>Location</h2>
                <p id="location">-</p>
            </div>
            <div>
                <h2>Timezone</h2>
                <p id="timezone">-</p>
            </div>
            <div>
                <h2>ISP</h2>
                <p id="isp">-</p>
            </div>
        </section>


    </header>

    <!--Space for the map-->
    <div id="map"></div>

    <footer>
        <div class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
            Coded by <a href="#">iva's lab</a>.
        </div>
    </footer>
</body>

</html>
